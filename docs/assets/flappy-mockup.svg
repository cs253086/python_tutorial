<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" font-family="system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7FD4DD"/>
      <stop offset="100%" stop-color="#70C5CE"/>
    </linearGradient>
    <linearGradient id="pipeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3F8B16"/>
      <stop offset="20%"  stop-color="#5BB31E"/>
      <stop offset="60%"  stop-color="#7BCF36"/>
      <stop offset="100%" stop-color="#3F8B16"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8DC92"/>
      <stop offset="100%" stop-color="#C9B36F"/>
    </linearGradient>
  </defs>

  <!-- darker sky-blue outer frame to match the snake card framing -->
  <rect width="540" height="540" fill="#3E8B97"/>

  <!-- top bar: tiny pipe + score on left -->
  <g transform="translate(18, 14)">
    <rect x="0" y="2" width="6" height="22" fill="#5BB31E" rx="1"/>
    <rect x="-2" y="0" width="10" height="6" fill="#5BB31E" rx="1"/>
  </g>
  <text x="38" y="30" fill="#ffffff" font-size="20" font-weight="700">2</text>

  <!-- right-side icons: fullscreen, speaker, close (same as snake card) -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path transform="translate(454, 12)"
          d="M0 6 V0 H6 M14 0 H20 V6 M20 14 V20 H14 M6 20 H0 V14"/>
  </g>
  <g transform="translate(486, 12)" fill="#ffffff">
    <path d="M2 7 H6 L12 2 V18 L6 13 H2 Z"/>
    <path d="M15 6 Q18 10 15 14" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(514, 12)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="0" y1="0" x2="14" y2="14"/>
    <line x1="14" y1="0" x2="0" y2="14"/>
  </g>

  <!-- play area -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="500" height="470" rx="8" ry="8" fill="url(#sky)"/>

    <!-- clouds -->
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="80"  cy="60"  rx="32" ry="14"/>
      <ellipse cx="100" cy="50"  rx="22" ry="14"/>
      <ellipse cx="62"  cy="56"  rx="18" ry="12"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="320" cy="100" rx="38" ry="16"/>
      <ellipse cx="345" cy="90"  rx="22" ry="14"/>
      <ellipse cx="300" cy="92"  rx="18" ry="12"/>
    </g>
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="430" cy="50"  rx="26" ry="12"/>
      <ellipse cx="445" cy="42"  rx="16" ry="10"/>
    </g>

    <!-- pipe 1 (further right, lower gap) -->
    <g>
      <!-- top pipe -->
      <rect x="240" y="0"   width="60" height="160" fill="url(#pipeBody)"/>
      <rect x="234" y="150" width="72" height="22"  fill="url(#pipeBody)" stroke="#2e6612" stroke-width="2"/>
      <!-- bottom pipe -->
      <rect x="240" y="290" width="60" height="120" fill="url(#pipeBody)"/>
      <rect x="234" y="278" width="72" height="22"  fill="url(#pipeBody)" stroke="#2e6612" stroke-width="2"/>
    </g>

    <!-- pipe 2 (off the right edge, higher gap) -->
    <g>
      <rect x="430" y="0"   width="60" height="100" fill="url(#pipeBody)"/>
      <rect x="424" y="90"  width="72" height="22"  fill="url(#pipeBody)" stroke="#2e6612" stroke-width="2"/>
      <rect x="430" y="230" width="60" height="180" fill="url(#pipeBody)"/>
      <rect x="424" y="218" width="72" height="22"  fill="url(#pipeBody)" stroke="#2e6612" stroke-width="2"/>
    </g>

    <!-- BIRD (left, mid-flap) -->
    <g transform="translate(110, 200)">
      <!-- body -->
      <rect x="-24" y="-20" width="48" height="40" rx="6" ry="6" fill="#FFD23F" stroke="#E0A21A" stroke-width="2"/>
      <!-- wing (flapping orange) -->
      <rect x="-16" y="-2"  width="22" height="14" rx="3" ry="3" fill="#FFA94D" stroke="#C97A26" stroke-width="1.5"/>
      <!-- eye white -->
      <circle cx="10" cy="-6" r="7" fill="#ffffff"/>
      <!-- pupil -->
      <circle cx="12" cy="-6" r="3.5" fill="#111111"/>
      <!-- beak -->
      <polygon points="22,-4 38,-1 22,8" fill="#FF6B35" stroke="#C44A1A" stroke-width="1.5"/>
    </g>

    <!-- ground -->
    <rect x="0" y="410" width="500" height="60" fill="url(#ground)"/>
    <!-- subtle grass top -->
    <rect x="0" y="408" width="500" height="6" fill="#5BB31E" opacity="0.5"/>
  </g>
</svg>
