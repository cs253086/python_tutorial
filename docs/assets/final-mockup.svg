<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" font-family="system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <pattern id="checker" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0"  y="0"  width="30" height="30" fill="#AAD751"/>
      <rect x="30" y="0"  width="30" height="30" fill="#A2D149"/>
      <rect x="0"  y="30" width="30" height="30" fill="#A2D149"/>
      <rect x="30" y="30" width="30" height="30" fill="#AAD751"/>
    </pattern>
  </defs>

  <!-- dark green outer frame -->
  <rect width="540" height="540" fill="#4A752C"/>

  <!-- top bar: apple + score on left -->
  <g transform="translate(18, 14)">
    <ellipse cx="10" cy="12" rx="9" ry="10" fill="#E74C3C"/>
    <path d="M10 3 q3 -3 6 -1 q-1 3 -4 3 z" fill="#5FA72F"/>
    <rect x="9" y="2" width="2" height="3" fill="#6A4A2A" rx="1"/>
  </g>
  <text x="48" y="30" fill="#ffffff" font-size="20" font-weight="700">0</text>

  <!-- right-side icons: fullscreen, speaker, close -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path transform="translate(454, 12)"
          d="M0 6 V0 H6 M14 0 H20 V6 M20 14 V20 H14 M6 20 H0 V14"/>
  </g>
  <g transform="translate(486, 12)" fill="#ffffff">
    <path d="M2 7 H6 L12 2 V18 L6 13 H2 Z"/>
    <path d="M15 6 Q18 10 15 14" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(514, 12)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="0" y1="0" x2="14" y2="14"/>
    <line x1="14" y1="0" x2="0" y2="14"/>
  </g>

  <!-- play area -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="500" height="470" rx="8" ry="8" fill="url(#checker)"/>

    <!-- SNAKE: row 8, cols 4..9, facing right -->
    <!-- tail (rounded left end) -->
    <rect x="120" y="242" width="36" height="26" rx="13" ry="13" fill="#4673E8"/>
    <!-- body segments -->
    <rect x="150" y="240" width="30" height="30" fill="#4673E8"/>
    <rect x="180" y="240" width="30" height="30" fill="#4673E8"/>
    <rect x="210" y="240" width="30" height="30" fill="#4673E8"/>
    <!-- head (rounded right end) -->
    <rect x="240" y="240" width="42" height="30" rx="13" ry="13" fill="#4673E8"/>
    <!-- subtle darker underside stripe -->
    <rect x="120" y="264" width="162" height="4" rx="2" fill="#3A5FC4" opacity="0.5"/>

    <!-- eyes on head, facing right -->
    <circle cx="270" cy="250" r="4" fill="#ffffff"/>
    <circle cx="272" cy="250" r="2" fill="#111111"/>
    <circle cx="270" cy="260" r="4" fill="#ffffff"/>
    <circle cx="272" cy="260" r="2" fill="#111111"/>

    <!-- APPLE at col 13, row 8 -->
    <g transform="translate(390, 240)">
      <ellipse cx="15" cy="17" rx="11" ry="12" fill="#E74C3C"/>
      <ellipse cx="11" cy="12" rx="3" ry="2" fill="#ffffff" opacity="0.55"/>
      <path d="M15 6 q4 -4 8 -1 q-2 4 -6 4 z" fill="#5FA72F"/>
      <rect x="14" y="4" width="2" height="4" fill="#5A3E22" rx="1"/>
    </g>
  </g>
</svg>
