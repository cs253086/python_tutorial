<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🐤 Flappy Bird — Play</title>
  <style>
    html, body {
      margin: 0;
      background: #0a1a36;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #0e1f3d;
      border-bottom: 1px solid #1d3a64;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 1px;
      color: #FFD23F;
    }
    header .actions { display: flex; gap: 10px; }
    header button, header a {
      background: #FFD23F;
      color: #1a1a1a;
      border: 0;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }
    header a.secondary {
      background: transparent;
      color: #cbd6e2;
      border: 1px solid #345a82;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 24px;
    }
    #turtle-canvas {
      width: 400px;
      height: 600px;
      max-width: 100%;
      background: #70C5CE;
      border: 1px solid #4a8b94;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    #out {
      margin: 1em 0 0;
      width: 400px;
      max-width: 100%;
      max-height: 220px;
      overflow: auto;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      min-height: 1.6em;
    }
    #out:empty::before {
      content: "Output and errors appear here while the game runs.";
      color: #6e7781;
    }
    #out.err { color: #ffb4b4; }
    #status {
      color: #cbd6e2;
      font-size: 13px;
      margin-left: auto;
      margin-right: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐤 FLAPPY BIRD</h1>
    <div class="actions">
      <span id="status"></span>
      <button id="replay">↻ Replay</button>
      <a href="#" id="back" class="secondary">← Back to lesson</a>
    </div>
  </header>

  <div class="stage">
    <div id="turtle-canvas"></div>
    <pre id="out"></pre>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/skulpt/skulpt-dist@master/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/skulpt/skulpt-dist@master/skulpt-stdlib.js"></script>
  <script>
    (function () {
      "use strict";
      const out = document.getElementById("out");
      const status = document.getElementById("status");
      const replayBtn = document.getElementById("replay");
      const backLink = document.getElementById("back");
      const canvas = document.getElementById("turtle-canvas");

      function loadCode() {
        try { return localStorage.getItem("flappy-play-code") || ""; }
        catch (_) { return ""; }
      }
      function loadBackUrl() {
        try { return localStorage.getItem("flappy-play-back") || ""; }
        catch (_) { return ""; }
      }

      function setStatus(s, isErr) {
        status.textContent = s || "";
        out.classList.toggle("err", !!isErr);
      }

      function skulptReady() {
        return typeof Sk !== "undefined" && Sk && Sk.builtinFiles;
      }

      function run() {
        const code = loadCode();
        if (!code.trim()) {
          out.textContent =
            "No code to run.\nGo back to the lesson and tap ▶ Play.";
          out.classList.add("err");
          return;
        }
        out.textContent = "";
        out.classList.remove("err");
        canvas.innerHTML = "";
        setStatus("Running…");

        let buf = "";
        const flush = () => { out.textContent = buf; };

        Sk.configure({
          output: (text) => { buf += text; flush(); },
          read: (name) => {
            if (
              Sk.builtinFiles === undefined ||
              Sk.builtinFiles["files"][name] === undefined
            ) {
              throw "File not found: '" + name + "'";
            }
            return Sk.builtinFiles["files"][name];
          },
          __future__: Sk.python3,
          inputfun: (prompt) =>
            new Promise((resolve) => {
              const a = window.prompt(prompt || "Your answer:");
              resolve(a === null ? "" : a);
            }),
          inputfunTakesPrompt: true,
          execLimit: null,
          yieldLimit: 100,
        });
        Sk.TurtleGraphics = {
          target: "turtle-canvas",
          width: 400,
          height: 600,
          assets: {},
        };

        Sk.misceval
          .asyncToPromise(() =>
            Sk.importMainWithBody("<stdin>", false, code, true)
          )
          .then(() => setStatus("Done ✅"))
          .catch((err) => {
            out.classList.add("err");
            out.textContent = (buf ? buf + "\n" : "") + (err && err.toString ? err.toString() : String(err));
            setStatus("Error ⚠️", true);
          });
      }

      function start() {
        const back = loadBackUrl();
        if (back) backLink.href = back;
        else backLink.href = "javascript:window.close();void 0;";
        let tries = 0;
        const tick = () => {
          if (skulptReady()) { run(); return; }
          tries++;
          if (tries > 60) {
            out.textContent = "Python runtime didn't load. Check your connection and reload.";
            out.classList.add("err");
            return;
          }
          setTimeout(tick, 150);
        };
        tick();
      }

      replayBtn.addEventListener("click", run);
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
